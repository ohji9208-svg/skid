const SH_DEF={base:"2026-11-07",teams:[{k:"A",g12:"오지훈",g3:"고우성",ph:0},{k:"B",g12:"우성제",g3:"유승규",ph:6},{k:"C",g12:"김영준",g3:"유재혁",ph:9},{k:"D",g12:"변영화",g3:"김완승",ph:3}]};
// ==== 인원·근무 순환 변동 (기간별) · 대시보드와 휴대폰이 같은 규칙을 씀 ====
// 근무 순환이 하루 밀리는 날: 이날은 모든 조가 전날 근무를 한 번 더 (근무표 엑셀 26년 12월 기준: 12/25)
const SH_HOLD=["2026-12-25"];
// 조 구성원 교체: 2027-01-01 부터 1st·2nd A조 = 박윤혁 (오지훈은 평일 주간으로)
const SH_SWAP=[{k:"A",g:"g12",from:"2027-01-01",n:"박윤혁"}];
// 추가 인원: w=짝 조(그 조가 s 근무하는 날 같이 근무) · w="WD" 는 평일 주간(토·일·공휴일 휴무)
const SH_EXTRA=[{n:"박윤혁",g:"g12",s:"D",p:[{to:"2026-11-30",w:"CD"},{from:"2026-12-02",to:"2026-12-31",w:"AB"}]},
  {n:"오지훈",g:"g12",s:"D",p:[{from:"2027-01-01",w:"WD"}]}];
const holdN=(k,base)=>SH_HOLD.filter(h=>h>base&&h<=k).length;
const memberAt=(t,g,k)=>{let n=t[g];SH_SWAP.forEach(w=>{if(w.k===t.k&&w.g===g&&(!w.from||k>=w.from)&&(!w.to||k<=w.to))n=w.n;});return n;};
const atDay=(t,k)=>{if(!t)return t;let o=null;GRP.forEach(G=>{const n=memberAt(t,G.g,k);if(n!==t[G.g]){o=o||{...t};o[G.g]=n;}});return o||t;};
function extrasOn(k,ds){const out=[];SH_EXTRA.forEach(x=>{const P=x.p.find(p=>(!p.from||k>=p.from)&&(!p.to||k<=p.to));if(!P)return;const s=P.s||x.s;
  if(P.w==="WD"){const d=new Date(k+"T00:00").getDay();if(d>0&&d<6&&!HOL[k])out.push({...x,s,wd:1});return;}
  const t=s==="D"?ds.D:ds.N;if(t&&P.w.includes(t.k))out.push({...x,s});});return out;}
const allMembers=(g,c)=>[...new Set([...c.teams.map(t=>t[g]),...SH_SWAP.filter(w=>w.g===g).map(w=>w.n),...SH_EXTRA.filter(x=>x.g===g).map(x=>x.n)].filter(Boolean))];
const SH_PAT="DDDOOONNNOOO";
const GRP=[{g:"g12",n:"1st·2nd",c:"b"},{g:"g3",n:"3rd",c:"r"}];
const TYPES=["연차","반차","교육","기타"];
const W="일월화수목금토";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dNum=k=>{const [y,m,d]=k.split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5);};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const recU=r=>r.u||r.at||0;
const md_=k=>{const d=new Date(k+"T00:00");return (d.getMonth()+1)+"/"+d.getDate()+"("+W[d.getDay()]+")";};
let me=ME;let recs=[],Y,M,sel=null,lastSync=0,busy=false,PREF=null;
const t0=new Date();Y=t0.getFullYear();M=t0.getMonth();

function live(){return recs.filter(r=>!r.del);}
function cfg(){const r=live().find(e=>e.kind==="cfg"&&e.id==="shiftcfg");return r&&r.cfg&&r.cfg.teams?r.cfg:SH_DEF;}
const shiftOf=(t,k,c)=>SH_PAT[(((dNum(k)-dNum(c.base)-holdN(k,c.base)+(+t.ph||0))%12)+12)%12];
function dayShift(k,c=cfg()){const r={D:null,N:null,off:[]};for(const t0 of c.teams){const t=atDay(t0,k),s=shiftOf(t0,k,c);if(s==="D"&&!r.D)r.D=t;else if(s==="N"&&!r.N)r.N=t;else r.off.push(t);}return r;}
const subsOf=k=>live().filter(e=>e.kind==="sub"&&e.date===k).sort((a,b)=>(a.at||0)-(b.at||0));
function mine(c=cfg()){for(const G of GRP)if(allMembers(G.g,c).includes(me))return {g:G.g};return null;}
function myShift(k,ds,m){if(!m)return null;const g=m.g;if(ds.D&&ds.D[g]===me)return "D";if(ds.N&&ds.N[g]===me)return "N";const e=extrasOn(k,ds).find(x=>x.n===me&&x.g===g);return e?e.s:null;}
function workers(k,ds,g){const L=[];if(ds.D)L.push({n:ds.D[g],s:"D",k:ds.D.k});if(ds.N)L.push({n:ds.N[g],s:"N",k:ds.N.k});extrasOn(k,ds).filter(x=>x.g===g).forEach(x=>L.push({n:x.n,s:x.s,x:1}));return L.filter(w=>w.n);}
function offPeople(k,ds,g,c=cfg()){const on=new Set(workers(k,ds,g).map(w=>w.n));return allMembers(g,c).filter(n=>!on.has(n));}
function myDay(k,ds,subs,m){if(!m)return null;const g=m.g,out=subs.find(z=>z.grp===g&&z.who===me),inn=subs.find(z=>z.grp===g&&z.sub===me),s=myShift(k,ds,m);
  if(s&&out)return {lab:out.type,cls:"lv"};
  if(inn){const w=workers(k,ds,g).find(w=>w.n===inn.who);return {s:w?w.s:"D",lab:"대근",by:inn.who};}
  if(s)return {s,lab:s==="D"?"주간":"야간"};return null;}
function stOf(md){if(!md)return {st:"off",b:"",lab:"휴무"};if(md.cls)return {st:"lv",b:md.lab.slice(0,2),lab:md.lab};
  if(md.lab==="대근")return {st:md.s==="N"?"subN":"subD",b:"대근",lab:(md.s==="N"?"야간":"주간")+" 대근"};return {st:md.s==="N"?"night":"day",b:md.s==="N"?"야":"주",lab:md.lab};}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("on"),2400);}
function syncLbl(){const e=$("syncLbl");if(!e)return;if(busy){e.textContent="동기화 중…";e.className="sync";return;}
  if(!lastSync){e.textContent="";return;}const d=new Date(lastSync);e.textContent=pad(d.getHours())+":"+pad(d.getMinutes());e.className="sync";}

/* ── 개인 일정 암호화 (이 휴대폰 안에서만 풀림) ── */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{u=new Uint8Array(u);let s="";for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let KEY=null;const PV={};
const vaultId=()=>"vault:"+me;
const vault=()=>live().find(r=>r.id===vaultId());
async function deriveKey(pass,salt){const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["encrypt","decrypt"]);}
async function seal(obj,k=KEY){const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,enc.encode(JSON.stringify(obj)));return {iv:b64(iv),c:b64(c)};}
async function unseal(r,k=KEY){const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(r.iv)},k,ub64(r.c));return JSON.parse(dec.decode(p));}
const newDK=()=>crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt","decrypt"]);
const impDK=raw=>crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},true,["encrypt","decrypt"]);
async function rememberKey(){if(LS("lockEach")==="1"&&vault()){LS("k_"+me,null);return;}LS("k_"+me,JSON.stringify(await crypto.subtle.exportKey("jwk",KEY)));}
async function restoreKey(){const s=LS("k_"+me);if(!s)return false;try{KEY=await crypto.subtle.importKey("jwk",JSON.parse(s),{name:"AES-GCM"},true,["encrypt","decrypt"]);return true;}catch(e){LS("k_"+me,null);return false;}}
async function ensureKey(){if(KEY)return true;if(vault())return false;KEY=await newDK();await rememberKey();return true;}
async function decryptAll(){if(!KEY)return;for(const r of recs){if(r.kind!=="priv"||r.del||r.id===vaultId()||r.owner!==me)continue;const c=PV[r.id];if(c&&c.u===recU(r))continue;
    try{PV[r.id]={u:recU(r),v:await unseal(r)};}catch(e){}}
  for(const id in PV){const r=recs.find(x=>x.id===id);if(!r||r.del)delete PV[id];}}
const evOf=k=>Object.entries(PV).filter(([,e])=>e.v.d===k).map(([id,e])=>({id,...e.v})).sort((a,b)=>((a.tm||"~")<(b.tm||"~")?-1:(a.tm||"~")>(b.tm||"~")?1:0));
const locked=()=>!!vault()&&!KEY;
async function setPassword(pass){if(!KEY&&vault())return false;if(!KEY)KEY=await newDK();
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),pk=await deriveKey(pass,salt);
  const w=await crypto.subtle.encrypt({name:"AES-GCM",iv},pk,new Uint8Array(await crypto.subtle.exportKey("raw",KEY))),old=recs.find(r=>r.id===vaultId());
  const ok=await saveMany([{id:vaultId(),kind:"priv",owner:me,v:2,salt:b64(salt),iv:b64(iv),c:b64(w),u:Math.max(Date.now(),old?recU(old)+1:0)}],"잠금 비밀번호를 저장했어요");
  if(ok)await rememberKey();return ok;}
async function unlock(pass){const v=vault();if(!v)return false;const pk=await deriveKey(pass,ub64(v.salt));let k;
  try{if(v.v===2)k=await impDK(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(v.iv)},pk,ub64(v.c)));else{await unseal(v,pk);k=pk;}}catch(e){return false;}
  KEY=k;await rememberKey();await decryptAll();render();return true;}
async function resetVault(){const t=Date.now(),L=recs.filter(r=>r.kind==="priv"&&!r.del&&r.owner===me).map(r=>({id:r.id,kind:"priv",owner:me,del:1,u:Math.max(t,recU(r)+1)}));
  if(L.length&&!(await saveMany(L,"내 일정을 모두 지웠어요")))return false;KEY=null;LS("k_"+me,null);for(const id in PV)delete PV[id];render();return true;}
function lockNow(){if(!vault())return;KEY=null;LS("k_"+me,null);for(const id in PV)delete PV[id];render();}

async function load(quiet){if(busy)return;busy=true;syncLbl();
  try{const r=await call("list");if(!r||!r.ok){if(r&&r.err==="pin")return badLink();throw new Error("응답 없음");}
    recs=r.recs||[];lastSync=Date.now();if(r.me&&r.me!=="admin"&&r.me!==me){me=r.me;LS("me",me);}if(!me)return badLink();
    if(!KEY)await restoreKey();await decryptAll();if(!$("cal"))shell();render();checkNotes();if(sel&&$("sheet").classList.contains("on")&&$("sheet").dataset.k===sel)openDay(sel,true);}
  catch(e){if(!quiet)toast("불러오기 실패 · 인터넷 연결을 확인하세요");const s=$("syncLbl");if(s){s.textContent="연결 안 됨";s.className="sync err";}if(!$("cal")&&me){shell();render();}}
  finally{busy=false;syncLbl();}}
async function saveMany(list,okMsg){
  const prev=recs.slice();for(const rec of list){const i=recs.findIndex(r=>r.id===rec.id);if(i>=0)recs[i]=rec;else recs.push(rec);}
  await decryptAll();render();refreshSheet();busy=true;syncLbl();let ok=false;
  try{let r=await call("save",list);for(let i=0;i<3&&r&&r.err==="busy";i++){await new Promise(z=>setTimeout(z,2500+i*2500));r=await call("save",list);}   // 다른 사람이 저장 중이면 잠깐 기다렸다 다시
    if(!r||!r.ok)throw new Error(r&&r.err||"");recs=r.recs||recs;lastSync=Date.now();ok=!r.denied;toast(r.denied?"본인 일정·근무만 바꿀 수 있어요":okMsg);}
  catch(e){recs=prev;toast("저장 실패 · 인터넷 연결을 확인하세요");}
  finally{busy=false;syncLbl();}
  await decryptAll();render();refreshSheet();if(ok)checkNotes(true);return ok;}
/* ── 내 근무 변화 알림 바 (휴대폰 알림이 꺼져 있어도 앱을 열면 위에서 내려옴) ──
   · 내 연차에 누가 대근을 신청/취소했을 때 · 누가 나를 대근으로 지정/해제했을 때 */
let NQ=[];
function checkNotes(silent){const m=mine();if(!m)return;const tk=key(new Date()),L=live().filter(x=>x.kind==="sub"&&x.date>=tk);
  let st=null;try{st=JSON.parse(LS("subSt_"+me)||"null");}catch(e){}
  const cur={};L.forEach(x=>{if(x.who===me)cur["o:"+x.id]=x.sub||"";else if(x.sub===me)cur["i:"+x.id]=x.who;});
  if(st&&!silent){const add=[];
    L.forEach(x=>{const d=md_(x.date);
      if(x.who===me){const p=st["o:"+x.id];if(p===undefined&&x.sub&&x.claim&&x.claim.by===x.sub&&x.claim.at>(st._t||0))add.push({k:x.date,t:`${x.sub}님이 ${d} ${x.type} 대근을 신청했어요`,c:"ok"});else if(p!==undefined&&p!==(x.sub||""))add.push(x.sub?{k:x.date,t:`${x.sub}님이 ${d} ${x.type} 대근을 신청했어요`,c:"ok"}:{k:x.date,t:`${p}님이 ${d} 대근 신청을 취소했어요 · 지금 미정`,c:"warn"});}
      else if(x.sub===me&&st["i:"+x.id]===undefined&&!(x.claim&&x.claim.by===me))add.push({k:x.date,t:`${x.who}님이 ${d} ${x.type} 대근으로 나를 지정했어요`,c:"ok"});});
    Object.keys(st).forEach(k=>{if(k.startsWith("i:")&&cur[k]===undefined){const x=recs.find(r=>r.id===k.slice(2));if(x&&!x.del&&x.date>=tk&&x.sub!==me)add.push({k:x.date,t:`${st[k]}님 ${md_(x.date)} 대근에서 빠졌어요`,c:"warn"});}});
    if(add.length){NQ=NQ.concat(add);showNote();}}
  cur._t=Date.now();LS("subSt_"+me,JSON.stringify(cur));}
function showNote(){const b=$("nbar");if(!NQ.length){b.classList.remove("on");return;}const n=NQ[0];
  b.className="nbar on "+(n.c||"");b.innerHTML=`<span class="ni">🔔</span><span class="nt">${esc(n.t)}${NQ.length>1?` <small>외 ${NQ.length-1}건</small>`:""}</span><button type="button" class="nb" data-go="${esc(n.k)}">보기</button><button type="button" class="nx" aria-label="닫기">✕</button>`;

const u8=b=>{const p="=".repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(r,c=>c.charCodeAt(0));};

async function pushSub(){try{const r=await navigator.serviceWorker.ready;return await r.pushManager.getSubscription();}catch(e){return null;}}
async function enablePush(){if(Notification.permission==="denied")return "denied";const perm=await Notification.requestPermission();if(perm!=="granted")return perm;
  const r=await navigator.serviceWorker.ready;let vap=PREF&&PREF.vapid;if(!vap){const x=await call("pref");PREF=x.pref?{...x.pref,vapid:x.vapid,push:x.push}:PREF;vap=x.vapid;}
  let sub=await r.pushManager.getSubscription();if(!sub)sub=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(vap)});
  const x=await call("subscribe",null,{endpoint:sub.endpoint,page:PAGE});if(!x||!x.ok)throw new Error("subscribe");

/* ── 예상 월급 (세전 · 추정) ──
   주간 07~19 · 야간 19~07 (12시간) · 월급제
   통상시급 = 기본급 ÷ 기준시간(209)
   대근 1회 = 12시간 × 시급 × 1.5 · 야간 대근은 22~06시 8시간 × 시급 × 0.5 추가 · 공휴일 대근은 8시간 넘는 4시간 × 시급 × 0.5 추가
   야간 근무가 있는 달: 식대 80,000원 + 기본 OT 8.7시간(× 시급 × 1.5)
   기본급·규칙은 이 휴대폰에만 저장 (서버로 보내지 않음) */
const PAYDEF={hb:209,bo:8.7,boR:1.5,nt:0.5,ntH:8,meal:80000,sD:[8,4,0],sN:[4,4,4],shift:"auto"};
const PRATE=[1.5,2,2.5];
function payCfg(){let o={};try{o=JSON.parse(LS("pay_"+me)||"{}")||{};}catch(e){}const P=Object.assign({sal:0},PAYDEF,o);
  ["sD","sN"].forEach(f=>{if(!Array.isArray(P[f])||P[f].length!==3)P[f]=PAYDEF[f].slice();});return P;}
function payX(){try{const a=JSON.parse(LS("payx_"+me)||"[]");return Array.isArray(a)?a:[];}catch(e){return [];}}
function payXSave(a){LS("payx_"+me,JSON.stringify(a.slice(-400)));}
const hEq=h=>h.reduce((t,x,i)=>t+(+x||0)*PRATE[i],0);
const tMin=t=>{const m=/^(\d\d):(\d\d)$/.exec(t||"");return m?+m[1]*60+ +m[2]:null;};
/* OT 시간 → 150·200·250% 나누기: 8시간까지 150%, 넘으면 200% · 22~06시는 +50% (처음부터 200%, 8시간 넘으면 250%) */
function otSplit(s,e){let a=tMin(s),b=tMin(e);if(a==null||b==null)return [0,0,0];if(b<=a)b+=1440;const h=[0,0,0];
  for(let t=a;t<b;t+=30){const el=(t-a)/60,hod=(t%1440)/60,night=hod>=22||hod<6;h[(el>=8?1:0)+(night?1:0)]+=.5;}return h;}
const otH=x=>Array.isArray(x.h)&&!x.s?x.h:otSplit(x.s,x.e);
const hTxt=h=>["150%","200%","250%"].map((t,i)=>+h[i]?`${t} ${+h[i]}h`:"").filter(Boolean).join(" · ")||"0시간";
function otMap(){const o={};payX().forEach(x=>{(o[x.d]=o[x.d]||[]).push(x);});return o;}
function payCalc(y,mo,P){const c=cfg(),m=mine(c),n=new Date(y,mo+1,0).getDate(),hr=(+P.sal||0)/(+P.hb||209),r=x=>Math.round(x);
  let d=0,nn=0,nights=0,rot=0;const L=[];
  for(let i=1;i<=n;i++){const k=y+"-"+pad(mo+1)+"-"+pad(i),ds=dayShift(k,c),subs=subsOf(k),md=myDay(k,ds,subs,m),o=stOf(md),dw=new Date(y,mo,i).getDay();
    if(o.st==="night")nights++;
    const s0=m&&myShift(k,ds,m);if(s0&&(s0==="N"||dw===0||dw===6||HOL[k]))rot++;
    if(o.st==="subD"||o.st==="subN"){const N=o.st==="subN",h=N?P.sN:P.sD;if(N)nn++;else d++;L.push({k,N,h,amt:hEq(h)*hr,by:(md||{}).by||""});}}
  const ym=y+"-"+pad(mo+1),X=payX().filter(x=>String(x.d||"").slice(0,7)===ym).sort((a,b)=>(a.d+(a.s||""))<(b.d+(b.s||""))?-1:1).map(x=>{const h=otH(x);return Object.assign({},x,{hh:h,amt:hEq(h)*hr});});
  const shift=P.shift==="on"?true:P.shift==="off"?false:rot>0;
  const bo=shift?r(P.bo*hr*P.boR):0,ntT=r(nights*P.ntH*hr*P.nt),meal=shift&&(nights+nn)>0?+P.meal||0:0,subT=r(L.reduce((a,x)=>a+x.amt,0)),xT=r(X.reduce((a,x)=>a+x.amt,0));
  return {hr,d,nn,nights,shift,L,X,bo,ntT,meal,subT,xT,total:r((+P.sal||0)+bo+ntT+meal+subT+xT)};}
function openPay(){let y=Y,mo=M;const won=x=>Math.round(x).toLocaleString("ko-KR")+"원";
  const paint=()=>{const P=payCfg(),R=payCalc(y,mo,P),ym=y+"-"+pad(mo+1);
    openSheet(`<div class="dsHead"><button class="dsX" type="button" id="xBtn" aria-label="닫기">✕</button><b>예상 월급</b><span></span></div>
      <div class="payM"><button class="ib" id="pPrev" type="button" aria-label="이전 달">‹</button><b>${y}년 ${mo+1}월</b><button class="ib" id="pNext" type="button" aria-label="다음 달">›</button></div>
      <label class="payIn"><span>내 기본급 (월)</span><input id="pSal" inputmode="numeric" placeholder="예: 3,000,000" value="${P.sal?Number(P.sal).toLocaleString("ko-KR"):""}"><em>원</em></label>
      ${P.sal?`<div class="payTot"><small>세전 예상</small><b>${won(R.total)}</b><span>통상시급 ${won(R.hr)} (기본급 ÷ ${P.hb})</span></div>
      <ul class="payL">
        <li><span>기본급</span><b>${won(P.sal)}</b></li>
        <li><span>보전수당 ${P.bo}시간 <small>${R.shift?"교대근무":"교대근무 아님 · 제외"}</small></span><b>${won(R.bo)}</b></li>
        <li><span>야간 근무 OT <small>${R.nights}회 × ${P.ntH}시간 × ${P.nt}</small></span><b>${won(R.ntT)}</b></li>
        <li><span>식대 <small>${R.meal?"교대 · 야간 근무 있음":R.shift?"야간 근무 없는 달 · 제외":"교대근무 아님 · 제외"}</small></span><b>${won(R.meal)}</b></li>
        <li><span>대근 OT <small>주간 ${R.d}회 · 야간 ${R.nn}회</small></span><b>${won(R.subT)}</b></li>
        ${R.L.map(x=>`<li class="sub"><span>${+x.k.slice(5,7)}/${+x.k.slice(8)} ${x.N?"야간":"주간"} 대근${x.by?` · ${esc(x.by)}님 대신`:""}<small>${hTxt(x.h)}</small></span><b>${won(x.amt)}</b></li>`).join("")}
        <li><span>OT 일정 <small>달력에 넣은 OT ${R.X.length}건</small></span><b>${won(R.xT)}</b></li>
        ${R.X.map(x=>`<li class="sub"><span>${+x.d.slice(5,7)}/${+x.d.slice(8)} ${x.s?`${tLbl(x.s)}~${tLbl(x.e)}`:"OT"}${x.m?` · <i class="pxm">${esc(x.m)}</i>`:""}<small>${hTxt(x.hh)}</small></span><b>${won(x.amt)}</b></li>`).join("")}
      </ul>`:`<div class="pvHint">기본급을 넣으면 이 달 근무표(대근 포함)로 바로 계산해요</div>`}
      <div class="pvHint pxHint">📅 OT는 달력에서 날짜를 눌러 <b>OT 일정</b>에 시간을 넣으면 여기에 자동으로 더해져요</div>
      <details class="payR"><summary>계산 규칙 보기·바꾸기</summary>
        <div class="payG">
          <label>시급 기준시간<input id="pHb" inputmode="decimal" value="${P.hb}"></label>
          <label>교대근무 (보전수당)<select id="pSh"><option value="auto"${P.shift==="auto"?" selected":""}>자동 (근무표로)</option><option value="on"${P.shift==="on"?" selected":""}>항상 받음</option><option value="off"${P.shift==="off"?" selected":""}>안 받음</option></select></label>
          <label>보전수당 시간<input id="pBo" inputmode="decimal" value="${P.bo}"></label>
          <label>보전수당 배율<input id="pBr" inputmode="decimal" value="${P.boR}"></label>
          <label>야간 1회 OT 시간<input id="pNh" inputmode="decimal" value="${P.ntH}"></label>
          <label>야간 OT 배율<input id="pNt" inputmode="decimal" value="${P.nt}"></label>
          <label>식대 (교대·야간 있는 달)<input id="pMe" inputmode="numeric" value="${P.meal}"></label><span></span>
        </div>
        <div class="payG3"><b>주간 대근</b>${P.sD.map((v,i)=>`<label>${["150%","200%","250%"][i]}<input data-s="sD" data-i="${i}" inputmode="decimal" value="${v}"></label>`).join("")}
          <b>야간 대근</b>${P.sN.map((v,i)=>`<label>${["150%","200%","250%"][i]}<input data-s="sN" data-i="${i}" inputmode="decimal" value="${v}"></label>`).join("")}</div>
        <p class="hint2">교대근무자는 보전수당 ${P.bo}시간 × ${P.boR} · 내 야간 근무 1회마다 ${P.ntH}시간 × ${P.nt} · 대근은 위 표대로 · OT 일정은 8시간까지 150%, 넘으면 200%, 22~06시는 +50% (처음부터 200%)</p>
        <button class="ghostBtn" id="pReset" type="button">처음 규칙으로</button>

      <p class="hint2">세금·보험료를 빼기 전 금액이고, 실제 급여명세서와 다를 수 있어요. 기본급과 추가 OT는 이 휴대폰에만 저장돼요.</p>`);
    $("xBtn").onclick=closeSheet;
    $("pPrev").onclick=()=>{if(--mo<0){mo=11;y--;}form=false;paint();};$("pNext").onclick=()=>{if(++mo>11){mo=0;y++;}form=false;paint();};
    const save=o=>{LS("pay_"+me,JSON.stringify(Object.assign(payCfg(),o)));};
    const num=v=>{const n=parseFloat(String(v).replace(/[^\d.]/g,""));return isFinite(n)?n:0;};
    const keep=fn=>{const op=document.querySelector(".payR").open;fn();paint();document.querySelector(".payR").open=op;};
    $("pSal").onchange=()=>{save({sal:num($("pSal").value)});paint();};
    $("pSal").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("pSal").blur();}});
    [["pHb","hb"],["pBo","bo"],["pBr","boR"],["pNh","ntH"],["pNt","nt"],["pMe","meal"]].forEach(([id,f])=>{$(id).onchange=()=>keep(()=>save({[f]:num($(id).value)}));});
    $("pSh").onchange=()=>keep(()=>save({shift:$("pSh").value}));
    document.querySelectorAll(".payG3 input").forEach(el=>{el.onchange=()=>keep(()=>{const P2=payCfg(),a=P2[el.dataset.s].slice();a[+el.dataset.i]=num(el.value);save({[el.dataset.s]:a});});});
    $("pReset").onclick=()=>{save(Object.assign({},PAYDEF,{sD:PAYDEF.sD.slice(),sN:PAYDEF.sN.slice()}));paint();document.querySelector(".payR").open=true;};
  };
  paint();}
async function openSettings(){const c=cfg(),m=mine(c);
  const paint=async()=>{const p=PREF||{},v=vault();let pushHtml;
    if(!PAGE)pushHtml=`<div class="hint2">휴대폰 알림은 새 QR(GitHub 주소)로 연 화면에서 켤 수 있어요.</div>`;
    else if(IOS&&!STANDALONE())pushHtml=`<div class="howto"><b>아이폰은 먼저 홈 화면에 추가해 주세요</b><ol><li>사파리 아래 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b></li><li>홈 화면의 <b>SKID 근무표</b> 아이콘으로 열기</li><li>여기서 <b>알림 켜기</b> (iOS 16.4 이상)</li></ol></div>`;
    else if(!PUSHOK())pushHtml=`<div class="hint2">이 브라우저는 알림을 지원하지 않아요. 크롬이나 삼성 인터넷으로 열어 주세요.</div>`;
    else{const sub=await pushSub(),perm=Notification.permission,on=perm==="granted"&&!!sub&&p.alarm!==false;
      pushHtml=`<label class="sw"><input type="checkbox" id="alOn"${on?" checked":""}><span class="swT"></span><span>대근 알림 (전날 저녁 6시 · 내 연차에 대근 신청이 올 때)</span></label>
        ${perm==="denied"?`<div class="err">알림이 차단돼 있어요 · 휴대폰 설정 → 알림에서 이 앱(또는 브라우저)을 허용해 주세요</div>`:""}
        <div class="row2"><button class="ghostBtn" id="alTest" type="button"${on?"":" disabled"}>테스트 알림 보내기</button></div><div class="err" id="alMsg"></div>`;}
    const sec=!v?`<p class="lead">내 일정은 이 휴대폰 안에서 암호화되어 저장돼요. 지금은 <b>이 휴대폰에서만</b> 볼 수 있어요.</p><button class="ghostBtn wide" id="pwMake" type="button">잠금 비밀번호 만들기 (선택)</button><div class="hint2">만들어 두면 휴대폰을 바꾸거나 홈 화면 앱에서도 내 일정을 볼 수 있어요.</div>`
      :KEY?`<p class="lead">비밀번호가 설정되어 있어요. 관리자도 내 일정을 볼 수 없어요.</p><label class="sw"><input type="checkbox" id="lkEach"${LS("lockEach")==="1"?" checked":""}><span class="swT"></span><span>앱을 열 때마다 비밀번호 묻기</span></label><div class="row2"><button class="ghostBtn" id="pwChange" type="button">비밀번호 바꾸기</button><button class="ghostBtn" id="lkNow" type="button">지금 잠그기</button></div>`
      :`<p class="lead">내 일정이 잠겨 있어요.</p><button class="add" id="pwOpen" type="button">잠금 풀기</button>`;
    openSheet(`<h2>설정<button class="x" type="button" id="xBtn" aria-label="닫기">✕</button></h2>
      <div class="who"><b>${esc(me)}</b>${m?` · ${esc(GRP.find(G=>G.g===m.g).n)}`:""}</div>
      <div class="thRow"><span>화면 모드</span><div class="thSeg" role="radiogroup" aria-label="화면 모드">${[["auto","자동"],["light","라이트"],["dark","다크"]].map(([v,l])=>`<button type="button" role="radio" data-th="${v}" aria-checked="${getTheme()===v}">${l}</button>`).join("")}</div></div>
      <div class="hint2 thHint">자동은 휴대폰의 다크 모드 설정을 따라가요</div>
      <button class="payGo" id="payGo" type="button"><span>💰</span><b>예상 월급 계산</b><small>기본급 + 대근 OT · 이 휴대폰에만 저장</small><i>›</i></button>

    $("xBtn").onclick=closeSheet;
    const b=id=>$(id);

    document.querySelectorAll(".thSeg [data-th]").forEach(x=>x.onclick=()=>{setTheme(x.dataset.th);document.querySelectorAll(".thSeg [data-th]").forEach(y=>y.setAttribute("aria-checked",y===x));toast(x.dataset.th==="auto"?"휴대폰 설정을 따라가요":x.dataset.th==="dark"?"다크 모드로 바꿨어요":"라이트 모드로 바꿨어요");});
    if(b("pwMake"))b("pwMake").onclick=()=>openLock();if(b("pwChange"))b("pwChange").onclick=()=>openLock("change");if(b("pwOpen"))b("pwOpen").onclick=()=>openLock();
    if(b("lkNow"))b("lkNow").onclick=()=>{lockNow();closeSheet();toast("잠갔어요");};
    if(b("lkEach"))b("lkEach").onchange=async()=>{LS("lockEach",b("lkEach").checked?"1":null);if(b("lkEach").checked)LS("k_"+me,null);else if(KEY)await rememberKey();toast(b("lkEach").checked?"앱을 열 때마다 비밀번호를 물어요":"이 휴대폰에서 기억해요");};
    const msg=(t,ok)=>{const e=b("alMsg");if(e){e.textContent=t;e.className="err"+(ok?" ok":"");}};

      try{if(el.checked){const r=await enablePush();if(r==="ok"){msg("알림을 켰어요 · 대근 전날 저녁 6시에 알려 드려요",true);b("alTest").disabled=false;}else{el.checked=false;msg(r==="denied"?"알림이 차단돼 있어요 · 휴대폰 설정에서 허용해 주세요":"알림 허용을 눌러야 켜져요");}}
        else{const y=await call("setpref",null,{alarm:false});if(y&&y.pref)PREF={...PREF,...y.pref};msg("알림을 껐어요",true);b("alTest").disabled=true;}}
      catch(e){el.checked=!el.checked;msg("설정 실패 · 인터넷 연결을 확인하세요");}finally{el.disabled=false;}};
    if(b("alTest"))b("alTest").onclick=async()=>{b("alTest").disabled=true;try{const t=await call("testpush");const s=t&&t.sent;msg(s==="sent"?"테스트 알림을 보냈어요 · 몇 초 안에 와요":s==="limit"?"테스트 알림은 하루 5번까지예요":s==="fail"?"보내기 실패 · 알림을 껐다가 다시 켜 보세요":"요청했어요 · 몇 초 안에 와요",s==="sent"||s==="unknown");}catch(e){msg("보내기 실패 · 다시 시도해 주세요");}b("alTest").disabled=false;};};
  await paint();if(!PREF||PREF.vapid==null){try{const r=await call("pref");if(r&&r.ok){PREF={...(r.pref||{}),vapid:r.vapid,push:r.push};if($("sheet").classList.contains("on")&&document.querySelector("#sheet .who"))await paint();}}catch(e){}}}
