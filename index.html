<style>
:root{--bg:#F4F5FA;--surf:#FFFFFF;--soft:#EEF0F6;--line:#E3E6EE;--ink:#141A2B;--muted:#6B7385;--p:#5B4BD8;--pS:rgba(91,75,216,.10);--red:#D6404C;--redS:rgba(229,72,77,.08);--sat:#3D6BD8;
 --gA:#4F6FD0;--gAb:#E8EDFB;--gB:#2E8C6B;--gBb:#DFF2EA;--gC:#D0581C;--gCb:#FCE7DC;--gD:#C2416B;--gDb:#FBE4EC;--g12:#A86F00;--g3:#B02AA8;
 --sh:0 10px 30px -18px rgba(20,24,40,.35)}
@media (prefers-color-scheme:dark){:root{--bg:#0F1320;--surf:#171C2B;--soft:#1F2536;--line:#2A3145;--ink:#ECEEF5;--muted:#9AA3B8;--p:#9D8CFF;--pS:rgba(157,140,255,.14);--red:#FF8A97;--redS:rgba(255,105,125,.10);--sat:#8FB0FF;
 --gA:#9DB4FF;--gAb:rgba(110,140,255,.18);--gB:#7ED9B4;--gBb:rgba(80,200,150,.15);--gC:#FF9A66;--gCb:rgba(255,130,80,.17);--gD:#FF8FB1;--gDb:rgba(255,120,160,.16);--g12:#F3C44F;--g3:#F29AF0;--sh:0 10px 30px -18px rgba(0,0,0,.7)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:8px;margin:2px 2px 12px}
header h1{font-size:19px;font-weight:900;margin:0;letter-spacing:-.2px}
header h1 small{display:block;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:0}
.meBtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surf);font-weight:800;font-size:13.5px}
.meBtn i{width:8px;height:8px;border-radius:50%;background:var(--p)}
.meBtn.none{color:var(--muted)}.meBtn.none i{background:var(--line)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.nav{display:flex;align-items:center;gap:6px;padding:10px 10px 6px}
.nav b{font-size:18px;font-weight:900;margin:0 4px;font-variant-numeric:tabular-nums}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surf);font-size:18px;line-height:1;display:grid;place-items:center}
.today{margin-left:auto;white-space:nowrap;flex:0 0 auto;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surf);font-weight:800;font-size:13px}

.grid{padding:2px 6px 8px;gap:3px}

.day.sun .dn,.day.hol .dn{color:var(--red)}.day.sat .dn{color:var(--sat)}
.day.hol{background:var(--redS);box-shadow:inset 0 2px 0 color-mix(in srgb,var(--red) 55%,transparent)}
.day .hn{font-size:9.5px;font-weight:800;color:var(--red);line-height:1.1;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.day.isToday .dn{background:var(--p);color:#fff!important;padding:0 6px}
.day.sel{box-shadow:inset 0 0 0 2px var(--p)}
.chips{display:flex;flex-direction:column;gap:2px;width:100%;align-items:center}
.c{display:inline-flex;align-items:center;justify-content:center;gap:1px;height:17px;min-width:30px;padding:0 5px;border-radius:6px;font-size:10.5px;font-weight:800;line-height:1}
.tA{background:var(--gAb);color:var(--gA)}.tB{background:var(--gBb);color:var(--gB)}.tC{background:var(--gCb);color:var(--gC)}.tD{background:var(--gDb);color:var(--gD)}
.c.mine{outline:2px solid currentColor;outline-offset:0}
.my{font-size:9.5px;font-weight:900;padding:1px 6px;border-radius:999px;background:var(--p);color:#fff;white-space:nowrap;line-height:1.35;margin-top:auto}
.day.work{background:var(--pS)}.day.work.hol{background:linear-gradient(var(--pS),var(--pS)),var(--redS)}
.my.lv{background:var(--muted)}
.dot{position:absolute;top:6px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--p)}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;padding:10px 4px 2px;font-size:12px;font-weight:700;color:var(--muted)}
.legend .c{min-width:0}
.summary{margin:12px 0 0;padding:12px 14px;font-size:13.5px;font-weight:700}
.summary b{color:var(--p);font-size:16px}
.summary .rows{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.summary .rows span{padding:3px 10px;border-radius:999px;background:var(--soft);font-size:12.5px}
/* 시트 */
.dim{position:fixed;inset:0;background:rgba(10,12,20,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surf);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.22,.8,.24,1),visibility 0s .28s;z-index:11;max-width:560px;margin:0 auto;box-shadow:0 -12px 40px -20px rgba(0,0,0,.4)}
.sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.22,.8,.24,1),visibility 0s}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-size:18px;font-weight:900;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sheet h2 .hb{font-size:12px;font-weight:800;color:var(--red);background:var(--redS);padding:3px 9px;border-radius:999px}
.x{margin-left:auto;width:32px;height:32px;border-radius:50%;border:0;background:var(--soft);font-size:16px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.tbl tr:last-child th,.tbl tr:last-child td{border-bottom:0}
.tbl thead th{background:var(--soft);font-size:12px;color:var(--muted);font-weight:800}
.tbl tbody th{font-size:13px;font-weight:900;white-space:nowrap}
.tbl .nm{font-weight:800}
.tbl .nm.me{color:var(--p)}
.tbl .chg{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.tbl .chg em{font-style:normal;color:var(--p)}
.tbl s{color:var(--muted)}
.off{font-size:12.5px;color:var(--muted);font-weight:700;margin:8px 2px 0}
h3{font-size:14px;font-weight:900;margin:16px 0 8px}
.subl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.subl li{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 12px;border-radius:12px;background:var(--soft);font-size:13.5px;font-weight:700}
.subl li .g{font-size:11px;font-weight:900;padding:2px 7px;border-radius:999px;background:var(--surf)}
.subl li .g.g12{color:var(--g12)}.subl li .g.g3{color:var(--g3)}
.subl li .by{font-size:11px;color:var(--muted);font-weight:600}
.del{margin-left:auto;flex:0 0 auto;height:30px;min-width:30px;padding:0 8px;border-radius:9px;border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:700}
.del.ask{background:var(--red);color:#fff;font-size:12.5px}
.empty{font-size:13px;color:var(--muted);font-weight:600;padding:4px 2px}
.form{display:grid;grid-template-columns:72px 1fr;gap:8px 10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px}
.form label{font-size:12.5px;font-weight:800;color:var(--muted)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border:0;border-radius:999px;background:transparent;font-weight:800;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 2px 8px -4px rgba(0,0,0,.3)}
.seg button.on.g12{color:var(--g12)}.seg button.on.g3{color:var(--g3)}
select{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surf);padding:0 12px;font-weight:700;font-size:15px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px;background-size:5px 5px;background-repeat:no-repeat}
.add{grid-column:1/-1;height:46px;border:0;border-radius:14px;background:var(--p);color:#fff;font-weight:900;font-size:15px;margin-top:4px}
.add:disabled{opacity:.4}
.hint{grid-column:1/-1;font-size:12px;color:var(--muted);font-weight:600;margin:-2px 2px 0}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:800;transition:all .25s;z-index:30;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.pin{max-width:340px;margin:18vh auto 0;padding:24px 20px;text-align:center}
.pin h2{margin:0 0 6px;font-size:20px;font-weight:900}
.pin p{margin:0 0 16px;color:var(--muted);font-size:13.5px;font-weight:600}
.pin input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surf);text-align:center;font-size:22px;font-weight:900;letter-spacing:6px}
.pin .add{width:100%;margin-top:12px}
.pin .err{color:var(--red);font-weight:800;font-size:13px;min-height:20px;margin-top:8px}
.names{display:flex;flex-direction:column;gap:12px}
.names .grp b{display:block;font-size:12.5px;font-weight:900;margin:0 0 6px}
.names .grp b.g12{color:var(--g12)}.names .grp b.g3{color:var(--g3)}
.names .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.names .opts button{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surf);font-weight:800;font-size:14px}
.names .opts button.on{border:2px solid var(--p);color:var(--p);background:var(--pS)}
.names .clr{height:40px;border-radius:12px;border:0;background:var(--soft);font-weight:800;color:var(--muted)}
.tX{background:var(--soft);color:var(--ink)}
.plus{margin-top:4px;font-size:13px}
.mine{margin:0 0 10px;padding:10px 12px;border-radius:12px;font-weight:800;font-size:14px;background:var(--soft);color:var(--muted)}
.mine.on{background:var(--pS);color:var(--p)}.mine.on b{font-size:16px}
.mine.lv{background:var(--soft);color:var(--ink)}
.fix{font-weight:900;font-size:15px}.fix small{font-weight:700;color:var(--muted)}
.note{margin:14px 2px 0;padding:11px 12px;border-radius:12px;background:var(--soft);font-size:13px;font-weight:700;color:var(--muted)}
.meBtn{cursor:default;white-space:nowrap;flex:0 0 auto}
header h1{min-width:0}
.ms{margin-top:auto;margin-bottom:2px;font-size:12px;font-weight:900;line-height:1;padding:6px 0;width:calc(100% - 4px);border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.st-day .ms{background:#FFE7B3;color:#8A5A00}
.day.st-night .ms{background:#3B3F8F;color:#fff}
.day.st-subD .ms{background:transparent;color:#8A5A00;box-shadow:inset 0 0 0 2px #F0B640}
.day.st-subN .ms{background:transparent;color:#3B3F8F;box-shadow:inset 0 0 0 2px #3B3F8F}
.day.st-lv .ms{background:var(--soft);color:var(--ink);text-decoration:none}
.day.st-off .ms{background:transparent;color:var(--muted);font-weight:700;font-size:11px}
.day.st-day,.day.st-subD{background:rgba(255,190,70,.10)}
.day.st-night,.day.st-subN{background:rgba(70,75,170,.08)}
@media (prefers-color-scheme:dark){.day.st-day .ms{background:#F2C14E;color:#2A1C00}.day.st-night .ms{background:#6E73E6;color:#fff}.day.st-subD .ms{color:#F2C14E;box-shadow:inset 0 0 0 2px #F2C14E}.day.st-subN .ms{color:#A9ADFF;box-shadow:inset 0 0 0 2px #8E93F2}.day.st-day,.day.st-subD{background:rgba(242,193,78,.08)}.day.st-night,.day.st-subN{background:rgba(110,115,230,.12)}}
.key{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 4px 0;font-size:11.5px;font-weight:800;color:var(--muted)}
.key .k{padding:3px 8px;border-radius:6px}
.key .k.kd{background:#FFE7B3;color:#8A5A00}.key .k.kn{background:#3B3F8F;color:#fff}.key .k.kl{background:var(--soft);color:var(--ink)}.key .k.ko{color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
@media (prefers-color-scheme:dark){.key .k.kd{background:#F2C14E;color:#2A1C00}.key .k.kn{background:#6E73E6}}
.key .kt{margin-left:auto;font-weight:700}
.day{min-height:70px!important}
.c{white-space:nowrap}
/* ── v1114 내 캘린더 ── */
.day{min-height:84px!important;justify-content:flex-start;padding:4px 2px 3px!important;gap:2px!important}

.more{font-size:10px;font-weight:800;color:var(--muted);text-align:left;padding-left:3px}

function offPeople(k,ds,g,c=cfg()){const on=new Set(workers(k,ds,g).map(w=>w.n));return [...c.teams.map(t=>t[g]),...SH_EXTRA.filter(x=>x.g===g).map(x=>x.n)].filter(n=>n&&!on.has(n));}
function myDay(k,ds,subs,m){if(!m)return null;const g=m.g,out=subs.find(z=>z.grp===g&&z.who===me),inn=subs.find(z=>z.grp===g&&z.sub===me),s=myShift(k,ds,m);
  if(s&&out)return {lab:out.type,cls:"lv"};
  if(inn){const w=workers(k,ds,g).find(w=>w.n===inn.who);return {s:w?w.s:"D",lab:"대근",by:inn.who};}
  if(s)return {s,lab:s==="D"?"주간":"야간"};return null;}
function stOf(md){if(!md)return {st:"off",b:"",lab:"휴무"};if(md.cls)return {st:"lv",b:md.lab.slice(0,2),lab:md.lab};
  if(md.lab==="대근")return {st:md.s==="N"?"subN":"subD",b:"대근",lab:(md.s==="N"?"야간":"주간")+" 대근"};return {st:md.s==="N"?"night":"day",b:md.s==="N"?"야":"주",lab:md.lab};}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("on"),2400);}
function syncLbl(){const e=$("syncLbl");if(!e)return;if(busy){e.textContent="동기화 중…";e.className="sync";return;}
  if(!lastSync){e.textContent="";return;}const d=new Date(lastSync);e.textContent=pad(d.getHours())+":"+pad(d.getMinutes());e.className="sync";}

/* ── 개인 일정 암호화 (이 휴대폰 안에서만 풀림) ── */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{u=new Uint8Array(u);let s="";for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let KEY=null;const PV={};
const vaultId=()=>"vault:"+me;
const vault=()=>live().find(r=>r.id===vaultId());
async function deriveKey(pass,salt){const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["encrypt","decrypt"]);}
async function seal(obj,k=KEY){const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,enc.encode(JSON.stringify(obj)));return {iv:b64(iv),c:b64(c)};}
async function unseal(r,k=KEY){const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(r.iv)},k,ub64(r.c));return JSON.parse(dec.decode(p));}
const newDK=()=>crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt","decrypt"]);
const impDK=raw=>crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},true,["encrypt","decrypt"]);
async function rememberKey(){if(LS("lockEach")==="1"&&vault()){LS("k_"+me,null);return;}LS("k_"+me,JSON.stringify(await crypto.subtle.exportKey("jwk",KEY)));}
async function restoreKey(){const s=LS("k_"+me);if(!s)return false;try{KEY=await crypto.subtle.importKey("jwk",JSON.parse(s),{name:"AES-GCM"},true,["encrypt","decrypt"]);return true;}catch(e){LS("k_"+me,null);return false;}}
async function ensureKey(){if(KEY)return true;if(vault())return false;KEY=await newDK();await rememberKey();return true;}
async function decryptAll(){if(!KEY)return;for(const r of recs){if(r.kind!=="priv"||r.del||r.id===vaultId()||r.owner!==me)continue;const c=PV[r.id];if(c&&c.u===recU(r))continue;
    try{PV[r.id]={u:recU(r),v:await unseal(r)};}catch(e){}}
  for(const id in PV){const r=recs.find(x=>x.id===id);if(!r||r.del)delete PV[id];}}
const evOf=k=>Object.entries(PV).filter(([,e])=>e.v.d===k).map(([id,e])=>({id,...e.v})).sort((a,b)=>((a.tm||"~")<(b.tm||"~")?-1:(a.tm||"~")>(b.tm||"~")?1:0));
const locked=()=>!!vault()&&!KEY;
async function setPassword(pass){if(!KEY&&vault())return false;if(!KEY)KEY=await newDK();
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),pk=await deriveKey(pass,salt);
  const w=await crypto.subtle.encrypt({name:"AES-GCM",iv},pk,new Uint8Array(await crypto.subtle.exportKey("raw",KEY))),old=recs.find(r=>r.id===vaultId());
  const ok=await saveMany([{id:vaultId(),kind:"priv",owner:me,v:2,salt:b64(salt),iv:b64(iv),c:b64(w),u:Math.max(Date.now(),old?recU(old)+1:0)}],"잠금 비밀번호를 저장했어요");
  if(ok)await rememberKey();return ok;}
async function unlock(pass){const v=vault();if(!v)return false;const pk=await deriveKey(pass,ub64(v.salt));let k;
  try{if(v.v===2)k=await impDK(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(v.iv)},pk,ub64(v.c)));else{await unseal(v,pk);k=pk;}}catch(e){return false;}
  KEY=k;await rememberKey();await decryptAll();render();return true;}
async function resetVault(){const t=Date.now(),L=recs.filter(r=>r.kind==="priv"&&!r.del&&r.owner===me).map(r=>({id:r.id,kind:"priv",owner:me,del:1,u:Math.max(t,recU(r)+1)}));
  if(L.length&&!(await saveMany(L,"내 일정을 모두 지웠어요")))return false;KEY=null;LS("k_"+me,null);for(const id in PV)delete PV[id];render();return true;}
function lockNow(){if(!vault())return;KEY=null;LS("k_"+me,null);for(const id in PV)delete PV[id];render();}

/* ── 불러오기 · 저장 ── */
async function load(quiet){if(busy)return;busy=true;syncLbl();
  try{const r=await call("list");if(!r||!r.ok){if(r&&r.err==="pin")return badLink();throw new Error("응답 없음");}
    recs=r.recs||[];lastSync=Date.now();if(r.me&&r.me!=="admin"&&r.me!==me){me=r.me;LS("me",me);}if(!me)return badLink();
    if(!KEY)await restoreKey();await decryptAll();if(!$("cal"))shell();render();if(sel&&$("sheet").classList.contains("on")&&$("sheet").dataset.k===sel)openDay(sel,true);}
  catch(e){if(!quiet)toast("불러오기 실패 · 인터넷 연결을 확인하세요");const s=$("syncLbl");if(s){s.textContent="연결 안 됨";s.className="sync err";}if(!$("cal")&&me){shell();render();}}
  finally{busy=false;syncLbl();}}
async function saveMany(list,okMsg){
  const prev=recs.slice();for(const rec of list){const i=recs.findIndex(r=>r.id===rec.id);if(i>=0)recs[i]=rec;else recs.push(rec);}
  await decryptAll();render();refreshSheet();busy=true;syncLbl();let ok=false;
  try{const r=await call("save",list);if(!r||!r.ok)throw new Error(r&&r.err||"");recs=r.recs||recs;lastSync=Date.now();ok=!r.denied;toast(r.denied?"본인 일정·근무만 바꿀 수 있어요":okMsg);}
  catch(e){recs=prev;toast("저장 실패 · 인터넷 연결을 확인하세요");}
  finally{busy=false;syncLbl();}
  await decryptAll();render();refreshSheet();return ok;}
function refreshSheet(){const sh=$("sheet");if(sh.classList.contains("on")&&sh.dataset.k&&/^\d{4}-/.test(sh.dataset.k))openDay(sh.dataset.k,true);}
const save=(rec,msg)=>saveMany([rec],msg);

  $("prv").onclick=()=>go(-1);$("nxt").onclick=()=>go(1);

  g.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;drag=false;},{passive:true});
  g.addEventListener("touchmove",e=>{if(sx==null)return;dx=e.touches[0].clientX-sx;const dy=e.touches[0].clientY-sy;if(!drag&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy))drag=true;
    if(drag){g.style.transition="none";g.style.transform=`translateX(${dx*.6}px)`;g.style.opacity=String(1-Math.min(Math.abs(dx)/600,.35));}},{passive:true});
  g.addEventListener("touchend",()=>{if(sx==null)return;sx=null;g.style.transition="";g.style.transform="";g.style.opacity="";if(drag&&Math.abs(dx)>60)go(dx<0?1:-1);},{passive:true});}

  try{g.getAnimations().forEach(a=>a.cancel());g.animate([{transform:`translateX(${dir*46}px)`,opacity:0},{transform:"none",opacity:1}],{duration:320,easing:"cubic-bezier(.22,.8,.24,1)"});

     <table class="tbl"><thead><tr><th></th>${GRP.map(G=>`<th>${G.n}</th>`).join("")}</tr></thead><tbody>${row("주간",ds.D,"D")}${row("야간",ds.N,"N")}</tbody></table>
     <div class="off">휴무 · ${ds.off.map(t=>`${esc(t.k)}조 (${esc(t.g12||"")}·${esc(t.g3||"")})`).join(", ")||"-"}</div>
     ${subs.length?`<ul class="subl">${subs.map(x=>`<li><span class="g ${esc(x.grp)}">${esc((GRP.find(G=>G.g===x.grp)||{}).n||"")}</span><span>${esc(x.who)} ${esc(x.type)} → ${x.sub?esc(x.sub)+" 대근":"대근 없음"}</span></li>`).join("")}</ul>`:""}</div></div>`;
  openSheet(h,k);$("sheet").classList.add("tall");$("xBtn").onclick=closeSheet;
  if(wasOpen){$("sheet").querySelectorAll("details[data-f]").forEach(dd=>{if(st0[dd.dataset.f]!=null)dd.open=st0[dd.dataset.f];});$("sheet").scrollTop=st0.top||0;if($("eT")&&st0.t!=null){$("eT").value=st0.t;$("eTm").value=st0.tm;}}
  const gl=$("goLock");if(gl)gl.onclick=openLock;
  $("sheet").querySelectorAll("[data-ty]").forEach(b=>b.onclick=()=>{const t=b.dataset.ty;if(CHG.type===t){CHG.type=null;}else{CHG.type=t;if(CHG.sub==="")CHG.sub=(()=>{const used=new Set(subs.filter(x=>x.grp===m.g&&x.sub).map(x=>x.sub));return offPeople(k,ds,m.g,c).filter(n=>n!==me&&!used.has(n))[0]||"";})();}openDay(k,true);});
  $("sheet").querySelectorAll("[data-su]").forEach(b=>b.onclick=()=>{CHG.sub=b.dataset.su;openDay(k,true);});
  if($("fAdd"))$("fAdd").onclick=()=>{const type=CHG.type,sub=CHG.sub,g=m.g;if(!type)return;
    if(sub&&!offPeople(k,dayShift(k),g).includes(sub)){toast("대근은 그날 휴무자만 가능해요");return;}
    const G=GRP.find(x=>x.g===g),text=`${me} ${type}`+(sub?` · ${sub} 대근`:""),t=Date.now();CHG={k,type:null,sub:""};
    save({id:uid(),date:k,text,c:G.c,kind:"sub",grp:g,who:me,type,sub,at:t,u:t,by:me},"근무 변경을 등록했어요 · 대시보드에도 반영돼요");};
  if($("eAdd")){const add=async()=>{const t=$("eT").value.trim();if(!t){$("eT").focus();return;}const tm=$("eTm").value||"";$("eAdd").disabled=true;
      if(!(await ensureKey())){$("eAdd").disabled=false;openLock();return;}const s=await seal({d:k,t,tm}),now=Date.now();$("eT").value="";$("eTm").value="";
      await save({id:"p"+uid(),kind:"priv",owner:me,...s,u:now},"일정을 저장했어요");};
    $("eAdd").onclick=add;$("eT").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();add();}};if(focusAdd)setTimeout(()=>$("eT")&&$("eT").focus(),300);}
  $("sheet").querySelectorAll("[data-pdel]").forEach(b=>twoTap(b,()=>{const r=recs.find(x=>x.id===b.dataset.pdel);if(!r)return;save({id:r.id,kind:"priv",owner:me,del:1,u:Math.max(Date.now(),recU(r)+1)},"일정을 지웠어요");},"삭제"));
  $("sheet").querySelectorAll("[data-sdel]").forEach(b=>twoTap(b,()=>{const x=recs.find(r=>r.id===b.dataset.sdel);if(!x||x.who!==me)return;save({id:x.id,del:1,kind:"sub",date:x.date,u:Math.max(Date.now(),recU(x)+1),ed:me},"근무 변경을 취소했어요");},"한 번 더 누르면 취소"));}

/* ── 잠금 비밀번호 (선택) ── */
function openLock(mode){const v=vault();
  if(!v||mode==="change"){openSheet(`<h2>${v?"비밀번호 바꾸기":"잠금 비밀번호 만들기"}<button class="x" type="button" id="xBtn" aria-label="닫기">✕</button></h2>
    <p class="lead">내 일정은 이미 <b>이 휴대폰 안에서 암호화</b>되어 저장돼요. 비밀번호를 만들면 <b>휴대폰을 바꾸거나 홈 화면 앱에서도</b> 내 일정을 볼 수 있어요. 다른 작업자와 관리자는 볼 수 없어요.</p>
    <div class="pwf"><input id="pw1" type="password" autocomplete="new-password" placeholder="비밀번호 (6자리 이상)" maxlength="40"><input id="pw2" type="password" autocomplete="new-password" placeholder="한 번 더 입력" maxlength="40"></div>
    <div class="warn">잊어버리면 아무도 되살릴 수 없어요. 생일·전화번호처럼 남이 알 만한 숫자는 피해 주세요.</div><div class="err" id="pwErr"></div>
    <button class="add" id="pwGo" type="button">저장</button>`);
    $("xBtn").onclick=closeSheet;
    $("pwGo").onclick=async()=>{const a=$("pw1").value,b=$("pw2").value;if(a.length<6){$("pwErr").textContent="6자리 이상으로 만들어 주세요";return;}if(a!==b){$("pwErr").textContent="두 번 입력한 비밀번호가 달라요";return;}
      $("pwGo").disabled=true;$("pwGo").textContent="저장 중…";const ok=await setPassword(a);if(ok){closeSheet();render();}else{$("pwGo").disabled=false;$("pwGo").textContent="저장";}};return;}
  openSheet(`<h2>내 일정 잠금 풀기<button class="x" type="button" id="xBtn" aria-label="닫기">✕</button></h2>
    <div class="pwf"><input id="pw1" type="password" autocomplete="current-password" placeholder="잠금 비밀번호" maxlength="40"></div><div class="err" id="pwErr"></div>
    <button class="add" id="pwGo" type="button">열기</button><button class="linkBtn" id="pwForgot" type="button">비밀번호를 잊었어요</button>`);
  $("xBtn").onclick=closeSheet;setTimeout(()=>$("pw1")&&$("pw1").focus(),300);
  const go=async()=>{const a=$("pw1").value;if(!a)return;$("pwGo").disabled=true;$("pwGo").textContent="여는 중…";const ok=await unlock(a);
    if(ok){closeSheet();toast("내 일정을 열었어요");}else{$("pwErr").textContent="비밀번호가 맞지 않아요";$("pwGo").disabled=false;$("pwGo").textContent="열기";}};
  $("pwGo").onclick=go;$("pw1").onkeydown=e=>{if(e.key==="Enter")go();};
  twoTap($("pwForgot"),async()=>{if(await resetVault()){closeSheet();toast("내 일정을 지웠어요 · 새로 시작해요");}},"내 일정을 모두 지우고 새로 시작 (한 번 더)");}

/* ── 설정: 휴대폰 알림 · 보안 ── */
const u8=b=>{const p="=".repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(r,c=>c.charCodeAt(0));};
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const STANDALONE=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const PUSHOK=()=>!!PAGE&&"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
async function pushSub(){try{const r=await navigator.serviceWorker.ready;return await r.pushManager.getSubscription();}catch(e){return null;}}
async function enablePush(){if(Notification.permission==="denied")return "denied";const perm=await Notification.requestPermission();if(perm!=="granted")return perm;
  const r=await navigator.serviceWorker.ready;let vap=PREF&&PREF.vapid;if(!vap){const x=await call("pref");PREF=x.pref?{...x.pref,vapid:x.vapid,push:x.push}:PREF;vap=x.vapid;}
  let sub=await r.pushManager.getSubscription();if(!sub)sub=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(vap)});
  const x=await call("subscribe",null,{endpoint:sub.endpoint,page:PAGE});if(!x||!x.ok)throw new Error("subscribe");
  const y=await call("setpref",null,{alarm:true,page:PAGE});if(y&&y.pref)PREF={...PREF,...y.pref,push:x.push};return "ok";}
async function openSettings(){const c=cfg(),m=mine(c);
  const paint=async()=>{const p=PREF||{},v=vault();let pushHtml;
    if(!PAGE)pushHtml=`<div class="hint2">휴대폰 알림은 새 QR(GitHub 주소)로 연 화면에서 켤 수 있어요.</div>`;
    else if(IOS&&!STANDALONE())pushHtml=`<div class="howto"><b>아이폰은 먼저 홈 화면에 추가해 주세요</b><ol><li>사파리 아래 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b></li><li>홈 화면의 <b>SKID 근무표</b> 아이콘으로 열기</li><li>여기서 <b>알림 켜기</b> (iOS 16.4 이상)</li></ol></div>`;
    else if(!PUSHOK())pushHtml=`<div class="hint2">이 브라우저는 알림을 지원하지 않아요. 크롬이나 삼성 인터넷으로 열어 주세요.</div>`;
    else{const sub=await pushSub(),perm=Notification.permission,on=perm==="granted"&&!!sub&&p.alarm!==false;
      pushHtml=`<label class="sw"><input type="checkbox" id="alOn"${on?" checked":""}><span class="swT"></span><span>대근 전날 저녁 6시에 휴대폰 알림</span></label>
        ${perm==="denied"?`<div class="err">알림이 차단돼 있어요 · 휴대폰 설정 → 알림에서 이 앱(또는 브라우저)을 허용해 주세요</div>`:""}
        <div class="row2"><button class="ghostBtn" id="alTest" type="button"${on?"":" disabled"}>테스트 알림 보내기</button></div><div class="err" id="alMsg"></div>`;}
    const sec=!v?`<p class="lead">내 일정은 이 휴대폰 안에서 암호화되어 저장돼요. 지금은 <b>이 휴대폰에서만</b> 볼 수 있어요.</p><button class="ghostBtn wide" id="pwMake" type="button">잠금 비밀번호 만들기 (선택)</button><div class="hint2">만들어 두면 휴대폰을 바꾸거나 홈 화면 앱에서도 내 일정을 볼 수 있어요.</div>`
      :KEY?`<p class="lead">비밀번호가 설정되어 있어요. 관리자도 내 일정을 볼 수 없어요.</p><label class="sw"><input type="checkbox" id="lkEach"${LS("lockEach")==="1"?" checked":""}><span class="swT"></span><span>앱을 열 때마다 비밀번호 묻기</span></label><div class="row2"><button class="ghostBtn" id="pwChange" type="button">비밀번호 바꾸기</button><button class="ghostBtn" id="lkNow" type="button">지금 잠그기</button></div>`
      :`<p class="lead">내 일정이 잠겨 있어요.</p><button class="add" id="pwOpen" type="button">잠금 풀기</button>`;
    openSheet(`<h2>설정<button class="x" type="button" id="xBtn" aria-label="닫기">✕</button></h2>
      <div class="who"><b>${esc(me)}</b>${m?` · ${esc(GRP.find(G=>G.g===m.g).n)}`:""}</div>
      <h3>대근 알림</h3>${pushHtml}<h3>내 일정 보안</h3>${sec}`);
    $("xBtn").onclick=closeSheet;
    const b=id=>$(id);
    if(b("pwMake"))b("pwMake").onclick=()=>openLock();if(b("pwChange"))b("pwChange").onclick=()=>openLock("change");if(b("pwOpen"))b("pwOpen").onclick=()=>openLock();
    if(b("lkNow"))b("lkNow").onclick=()=>{lockNow();closeSheet();toast("잠갔어요");};
    if(b("lkEach"))b("lkEach").onchange=async()=>{LS("lockEach",b("lkEach").checked?"1":null);if(b("lkEach").checked)LS("k_"+me,null);else if(KEY)await rememberKey();toast(b("lkEach").checked?"앱을 열 때마다 비밀번호를 물어요":"이 휴대폰에서 기억해요");};
    const msg=(t,ok)=>{const e=b("alMsg");if(e){e.textContent=t;e.className="err"+(ok?" ok":"");}};
    if(b("alOn"))b("alOn").onchange=async()=>{const el=b("alOn");el.disabled=true;
      try{if(el.checked){const r=await enablePush();if(r==="ok"){msg("알림을 켰어요 · 대근 전날 저녁 6시에 알려 드려요",true);b("alTest").disabled=false;}else{el.checked=false;msg(r==="denied"?"알림이 차단돼 있어요 · 휴대폰 설정에서 허용해 주세요":"알림 허용을 눌러야 켜져요");}}
        else{const y=await call("setpref",null,{alarm:false});if(y&&y.pref)PREF={...PREF,...y.pref};msg("알림을 껐어요",true);b("alTest").disabled=true;}}
      catch(e){el.checked=!el.checked;msg("설정 실패 · 인터넷 연결을 확인하세요");}finally{el.disabled=false;}};
    if(b("alTest"))b("alTest").onclick=async()=>{b("alTest").disabled=true;try{const t=await call("testpush");const s=t&&t.sent;msg(s==="sent"?"테스트 알림을 보냈어요 · 몇 초 안에 와요":s==="limit"?"테스트 알림은 하루 5번까지예요":s==="fail"?"보내기 실패 · 알림을 껐다가 다시 켜 보세요":"요청했어요 · 몇 초 안에 와요",s==="sent"||s==="unknown");}catch(e){msg("보내기 실패 · 다시 시도해 주세요");}b("alTest").disabled=false;};};
  await paint();if(!PREF||PREF.vapid==null){try{const r=await call("pref");if(r&&r.ok){PREF={...(r.pref||{}),vapid:r.vapid,push:r.push};if($("sheet").classList.contains("on")&&document.querySelector("#sheet .who"))await paint();}}catch(e){}}}

/* 자동 새로고침: 화면으로 돌아올 때 · 1분마다 */
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&READY&&Date.now()-lastSync>15000)load(true);});
setInterval(()=>{if(!document.hidden&&READY&&!$("sheet").classList.contains("on"))load(true);},60000);
if(READY)load();else badLink();
</script>
</body>
