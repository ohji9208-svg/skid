header{display:flex;align-items:center;gap:8px;margin:2px 2px 12px}

.sync.err{color:var(--red)}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.wk{padding:0 6px;font-size:12px;font-weight:800;color:var(--muted);text-align:center}
.wk span{padding:4px 0}.wk span:first-child{color:var(--red)}.wk span:last-child{color:var(--sat)}
.grid{padding:2px 6px 8px;gap:3px}

.day.sun .dn,.day.hol .dn{color:var(--red)}.day.sat .dn{color:var(--sat)}
.day.hol{background:var(--redS);box-shadow:inset 0 2px 0 color-mix(in srgb,var(--red) 55%,transparent)}
.day .hn{font-size:9.5px;font-weight:800;color:var(--red);line-height:1.1;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.day.isToday .dn{background:var(--p);color:#fff!important;padding:0 6px}
.day.sel{box-shadow:inset 0 0 0 2px var(--p)}
.chips{display:flex;flex-direction:column;gap:2px;width:100%;align-items:center}
.c{display:inline-flex;align-items:center;justify-content:center;gap:1px;height:17px;min-width:30px;padding:0 5px;border-radius:6px;font-size:10.5px;font-weight:800;line-height:1}
.tA{background:var(--gAb);color:var(--gA)}.tB{background:var(--gBb);color:var(--gB)}.tC{background:var(--gCb);color:var(--gC)}.tD{background:var(--gDb);color:var(--gD)}
.c.mine{outline:2px solid currentColor;outline-offset:0}
.my{font-size:9.5px;font-weight:900;padding:1px 6px;border-radius:999px;background:var(--p);color:#fff;white-space:nowrap;line-height:1.35;margin-top:auto}
.day.work{background:var(--pS)}.day.work.hol{background:linear-gradient(var(--pS),var(--pS)),var(--redS)}

.dim.on{opacity:1;pointer-events:auto}

.sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.22,.8,.24,1),visibility 0s}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}

async function gasGet(url,q){const u=url+(url.includes('?')?'&':'?')+'api=1&'+Object.entries(q).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&')+'&_='+Date.now();
  const r=await fetch(u,{redirect:'follow',cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();try{return JSON.parse(t);}catch(e){throw new Error('notjson');}}
 async function gasCall(url,pin,op,recs,names){const q={pin,op:op==='tokens'?'tokens':'list'};if(names)q.names=JSON.stringify(names);
  if(op==='save'&&recs&&recs.length){const body=JSON.stringify({op:'save',pin,recs,names});
   try{const r=await fetch(url,{method:'POST',body,redirect:'follow',cache:'no-store'});const t=await r.text();return JSON.parse(t);}
   catch(e){await fetch(url,{method:'POST',body,mode:'no-cors',redirect:'follow',cache:'no-store'});return await gasGet(url,q);}}
  return await gasGet(url,q);}
async function call(op,list){if(!API)throw new Error("no api");return await gasCall(API,TOK,op,list||[]);}
function live(){return recs.filter(r=>!r.del);}
function cfg(){const r=live().find(e=>e.kind==="cfg"&&e.id==="shiftcfg");return r&&r.cfg&&r.cfg.teams?r.cfg:SH_DEF;}
const shiftOf=(t,k,c)=>SH_PAT[(((dNum(k)-dNum(c.base)+(+t.ph||0))%12)+12)%12];
function dayShift(k,c=cfg()){const r={D:null,N:null,off:[]};for(const t of c.teams){const s=shiftOf(t,k,c);if(s==="D"&&!r.D)r.D=t;else if(s==="N"&&!r.N)r.N=t;else r.off.push(t);}return r;}
function extrasOn(k,ds){return SH_EXTRA.filter(x=>{const P=x.p.find(p=>(!p.from||k>=p.from)&&(!p.to||k<=p.to));if(!P)return false;const t=x.s==="D"?ds.D:ds.N;return !!t&&P.w.includes(t.k);});}
const subsOf=k=>live().filter(e=>e.kind==="sub"&&e.date===k).sort((a,b)=>(a.at||0)-(b.at||0));
// 나: 조 소속이면 {t,g}, 추가 인원이면 {x,g}
function mine(c=cfg()){for(const t of c.teams)for(const G of GRP)if(t[G.g]===me)return {t,g:G.g};const x=SH_EXTRA.find(x=>x.n===me);return x?{x,g:x.g}:null;}
// 그날 내 근무: "D" | "N" | null (근무 변경 반영 전)
function myShift(k,ds,m){if(!m)return null;if(m.t)return ds.D===m.t?"D":ds.N===m.t?"N":null;return extrasOn(k,ds).includes(m.x)?m.x.s:null;}
// 그날 그룹 g 에서 근무하는 사람들 [{n,s}]
function workers(k,ds,g){const L=[];if(ds.D)L.push({n:ds.D[g],s:"D",k:ds.D.k});if(ds.N)L.push({n:ds.N[g],s:"N",k:ds.N.k});extrasOn(k,ds).filter(x=>x.g===g).forEach(x=>L.push({n:x.n,s:x.s,x:1}));return L.filter(w=>w.n);}
function offPeople(k,ds,g,c=cfg()){const on=new Set(workers(k,ds,g).map(w=>w.n));return [...c.teams.map(t=>t[g]),...SH_EXTRA.filter(x=>x.g===g).map(x=>x.n)].filter(n=>n&&!on.has(n));}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("on"),2200);}
function syncLbl(){const e=$("syncLbl");if(!e)return;if(busy){e.textContent="동기화 중…";e.className="sync";return;}
  if(!lastSync){e.textContent="";return;}const d=new Date(lastSync);e.textContent=pad(d.getHours())+":"+pad(d.getMinutes())+" 기준";e.className="sync";}

/* 불러오기 · 저장 */
async function load(quiet){if(busy)return;busy=true;syncLbl();
  try{const r=await call("list");if(!r||!r.ok){if(r&&r.err==="pin")return badLink();throw new Error("응답 없음");}
    recs=r.recs||[];lastSync=Date.now();if(r.me&&r.me!=="admin"&&r.me!==me){me=r.me;LS("me",me);}if(!me)return badLink();if(!$("cal"))shell();render();if(sel)openDay(sel,true);}
  catch(e){if(!quiet)toast("불러오기 실패 · 인터넷 연결을 확인하세요");const s=$("syncLbl");if(s){s.textContent="연결 안 됨";s.className="sync err";}if(!$("cal")){shell();render();}}
  finally{busy=false;syncLbl();}}
async function save(rec,okMsg){
  const prev=recs.slice();const i=recs.findIndex(r=>r.id===rec.id);if(i>=0)recs[i]=rec;else recs.push(rec);render();if(sel)openDay(sel,true);
  busy=true;syncLbl();
  try{const r=await call("save",[rec]);if(!r||!r.ok)throw new Error(r&&r.err||"");recs=r.recs||recs;lastSync=Date.now();toast(r.denied?"본인 근무만 바꿀 수 있어요":okMsg);}
  catch(e){recs=prev;toast("저장 실패 · 다시 시도해 주세요");}
  finally{busy=false;syncLbl();}
  render();if(sel)openDay(sel,true);}

// 그날 나의 최종 상태: {s:"D"|"N", lab, cls} 또는 null
function myDay(k,ds,subs,m){if(!m)return null;const g=m.g,out=subs.find(z=>z.grp===g&&z.who===me),inn=subs.find(z=>z.grp===g&&z.sub===me),s=myShift(k,ds,m);
  if(s&&out)return {lab:out.type,cls:"lv"};
  if(inn){const w=workers(k,ds,g).find(w=>w.n===inn.who);return {s:w?w.s:"D",lab:"대근"};}
  if(s)return {s,lab:s==="D"?"주간":"야간"};return null;}
function render(){if(!$("grid"))return;const c=cfg(),m=mine(c),tk=key(new Date());
  $("ym").textContent=Y+"."+pad(M+1);
  $("meBtn").innerHTML=`<i></i>${esc(me)}${m?` · ${esc(GRP.find(G=>G.g===m.g).n)}`:""}`;
  const f=new Date(Y,M,1),s=new Date(f);s.setDate(1-f.getDay());let h="";
  const n=(new Date(Y,M+1,0).getDate()+f.getDay())>35?42:35;
  for(let i=0;i<n;i++){const d=new Date(s);d.setDate(s.getDate()+i);const k=key(d),ds=dayShift(k,c),subs=subsOf(k),hol=HOL[k],md=myDay(k,ds,subs,m);
    // 내 상태: 주간 · 야간 · 대근 · 연차 등 · 휴무
    let st="off",lab="휴무";if(md){if(md.cls){st="lv";lab=md.lab;}else if(md.lab==="대근"){st=md.s==="N"?"subN":"subD";lab=md.s==="N"?"야간 대근":"주간 대근";}else{st=md.s==="N"?"night":"day";lab=md.lab;}}
    h+=`<button type="button" class="day st-${st}${d.getMonth()!==M?" out":""}${d.getDay()===0?" sun":""}${d.getDay()===6?" sat":""}${hol?" hol":""}${k===tk?" isToday":""}${k===sel?" sel":""}" data-k="${k}" aria-label="${d.getMonth()+1}월 ${d.getDate()}일${hol?" "+esc(hol):""} ${esc(lab)}">
      <span class="dn">${d.getDate()}</span>${hol?`<span class="hn">${esc(hol)}</span>`:""}<span class="ms">${esc(lab)}</span>${subs.length?'<i class="dot"></i>':""}</button>`;}
  $("grid").innerHTML=h;
  syncLbl();}

function openSheet(html){$("sheet").innerHTML='<div class="grab"></div>'+html;$("dim").classList.add("on");$("sheet").classList.add("on");}
function closeSheet(){$("dim").classList.remove("on");$("sheet").classList.remove("on");if(sel){sel=null;render();}}
$("dim").onclick=closeSheet;
function openDay(k,keep){sel=k;if(!keep)render();const c=cfg(),ds=dayShift(k,c),subs=subsOf(k),d=new Date(k+"T00:00"),hol=HOL[k],m=mine(c);
  const nm=(n,g)=>{const x=subs.find(s=>s.grp===g&&s.who===n);const meC=n===me||(x&&x.sub===me)?" me":"";
    if(!x)return `<span class="nm${meC}">${esc(n)}</span>`;
    return `<span class="nm${meC}">${x.sub?esc(x.sub):`<s>${esc(n)}</s>`}</span><span class="chg">${esc(n)} ${esc(x.type)} → ${x.sub?`<em>${esc(x.sub)} 대근</em>`:"대근 없음"}</span>`;};
  const xs=extrasOn(k,ds);
  const row=(lab,t,sh)=>`<tr><th>${lab}${t?` <span class="c t${esc(t.k)}">${esc(t.k)}</span>`:""}</th>${GRP.map(G=>`<td>${t?nm(t[G.g]||"-",G.g):"-"}${xs.filter(x=>x.s===sh&&x.g===G.g).map(x=>`<div class="plus">+ ${nm(x.n,G.g)}</div>`).join("")}</td>`).join("")}</tr>`;
  const md=myDay(k,ds,subs,m),myOut=m&&subs.find(z=>z.grp===m.g&&z.who===me),s0=myShift(k,ds,m);
  let h=`<h2>${d.getMonth()+1}월 ${d.getDate()}일 (${W[d.getDay()]})${hol?`<span class="hb">${esc(hol)}</span>`:""}<button class="x" type="button" id="xBtn" aria-label="닫기">✕</button></h2>
   ${m?`<div class="mine ${md?(md.cls?"lv":"on"):"off"}">${md?(md.cls?`내 근무: ${esc(md.lab)} (쉼)`:`내 근무: <b>${esc(md.lab)}</b>`):"내 근무: 휴무"}</div>`:""}
   <table class="tbl"><thead><tr><th></th>${GRP.map(G=>`<th>${G.n}</th>`).join("")}</tr></thead><tbody>${row("주간",ds.D,"D")}${row("야간",ds.N,"N")}</tbody></table>
   <div class="off">휴무 · ${ds.off.map(t=>`${esc(t.k)}조 (${esc(t.g12||"")}·${esc(t.g3||"")})`).join(", ")||"-"}</div>
   <h3>근무 변경</h3>`+(subs.length?`<ul class="subl">${subs.map(x=>`<li><span class="g ${esc(x.grp)}">${esc((GRP.find(G=>G.g===x.grp)||{}).n||"")}</span><span>${esc(x.who)} ${esc(x.type)} → ${x.sub?esc(x.sub)+" 대근":"대근 없음"}${x.by?`<span class="by"> · ${esc(x.ed||x.by)}</span>`:""}</span>${x.who===me?`<button class="del" type="button" data-del="${esc(x.id)}" aria-label="삭제">✕</button>`:""}</li>`).join("")}</ul>`:`<div class="empty">등록된 근무 변경이 없어요</div>`);
  if(m&&s0&&!myOut){h+=`<h3>내 근무 변경</h3><div class="form">
     <label>근무자</label><div class="fix">${esc(me)} <small>(${s0==="D"?"주간":"야간"})</small></div>
     <label for="fT">사유</label><select id="fT">${TYPES.map(t=>`<option>${t}</option>`).join("")}</select>
     <label for="fS">대근자</label><select id="fS"></select>
     <div class="hint">대근은 그날 휴무자만 고를 수 있어요</div>
     <button class="add" id="fAdd" type="button">근무 변경 등록</button></div>`;}
  else if(m&&myOut)h+=`<div class="note">내 근무 변경이 이미 있어요. 바꾸려면 ✕로 지우고 다시 등록하세요.</div>`;
  else if(m&&md&&md.lab==="대근"){const z=subs.find(q=>q.grp===m.g&&q.sub===me);h+=`<div class="note">대근 근무예요. 변경은 원래 근무자(${esc(z?z.who:"")})만 할 수 있어요.</div>`;}
  else if(m)h+=`<div class="note">이 날은 내 근무가 없어요. 본인 근무만 변경할 수 있어요.</div>`;
  openSheet(h);$("xBtn").onclick=closeSheet;
  if($("fS")){const used=new Set(subs.filter(x=>x.grp===m.g&&x.sub).map(x=>x.sub)),cand=offPeople(k,ds,m.g,c).filter(n=>n!==me&&!used.has(n));
    $("fS").innerHTML=`<option value="">대근 없음</option>`+cand.map(n=>`<option value="${esc(n)}">${esc(n)} (휴무)</option>`).join("");if(cand[0])$("fS").value=cand[0];
    $("fAdd").onclick=()=>{const type=$("fT").value,sub=$("fS").value,g=m.g;
      if(sub&&!offPeople(k,dayShift(k),g).includes(sub)){toast("대근은 그날 휴무자만 가능해요");return;}
      const G=GRP.find(x=>x.g===g),text=`${me} ${type}`+(sub?` · ${sub} 대근`:""),t=Date.now();
      save({id:uid(),date:k,text,c:G.c,kind:"sub",grp:g,who:me,type,sub,at:t,u:t,by:me},"저장했어요 · 대시보드에도 반영돼요");};}
  $("sheet").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(!b.classList.contains("ask")){b.classList.add("ask");b.textContent="삭제";setTimeout(()=>{if(b.isConnected){b.classList.remove("ask");b.textContent="✕";}},3000);return;}
    const x=recs.find(r=>r.id===b.dataset.del);if(!x||x.who!==me)return;save({id:x.id,del:1,kind:"sub",date:x.date,u:Math.max(Date.now(),recU(x)+1),ed:me},"삭제했어요");});}

/* 자동 새로고침: 화면으로 돌아올 때 · 1분마다 */
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&TOK&&Date.now()-lastSync>15000)load(true);});
setInterval(()=>{if(!document.hidden&&TOK)load(true);},60000);
if(TOK&&API)load();else badLink();
</script>
</body>
